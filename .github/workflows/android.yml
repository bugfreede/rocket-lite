name: Android Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install Android NDK 26.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125"

      - name: Build libbox.aar (sing-box v1.11.15, arm64 only)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          GOPROXY: https://proxy.golang.org,direct
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          git clone --depth 1 --branch v1.11.15 https://github.com/SagerNet/sing-box.git "$HOME/sing-box"
          cd "$HOME/sing-box"
          gomobile init
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          gomobile bind -target android/arm64 -androidapi 26 \
            -o "$GITHUB_WORKSPACE/app/libs/libbox.aar" \
            -trimpath -ldflags "-s -w" \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api" \
            ./experimental/libbox
          ls -la "$GITHUB_WORKSPACE/app/libs"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocketlite-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "RocketLite ${{ github.ref_name }}" \
            --notes "Phase 2 build: sing-box core (libbox, arm64) integrated. Debug-signed APK for real-device testing. Requires an arm64 Android phone; allow installing unknown apps to sideload."
