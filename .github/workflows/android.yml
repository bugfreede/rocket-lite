# Corrected workflow for bugfreede/rocket-lite — prepared 2026-11-10 (Asia/Shanghai).
# Diff vs commit 4532aa7 (.github/workflows/android.yml, fetched from GitHub 2026-11-10 08:37 UTC):
#   ONLY the "Build libbox.aar" step changes:
#   - `gomobile init` -> `gomobile init || true`
#       (the Box-verified script libbox_build_lean.sh runs it with `|| true`;
#        the CI copy dropped the tolerance. Run #1 for tag v0.2.0-phase2 died
#        in this step after ~1 min; this is the leading suspect. Exact failing
#        command inside the step is still unverified — the job log page
#        would not load during preparation.)
#   - adds `export GOMAXPROCS=2 GOFLAGS="-p=2"` (same as the Box-verified script).
# Everything else is byte-identical to the fetched workflow.
# To apply (needs the Box agent back, or any git access to the repo):
#   cp this file to .github/workflows/android.yml, commit, push master,
#   then re-trigger: delete + re-push tag v0.2.0-phase2, or push a new tag.
name: Android Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install Android NDK 26.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125"

      - name: Build libbox.aar (sing-box v1.11.15, arm64 only)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          GOPROXY: https://proxy.golang.org,direct
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          export GOMAXPROCS=2 GOFLAGS="-p=2"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          git clone --depth 1 --branch v1.11.15 https://github.com/SagerNet/sing-box.git "$HOME/sing-box"
          cd "$HOME/sing-box"
          # Box-verified script runs this with `|| true`: on current
          # golang.org/x/mobile it can fail even when `gomobile bind`
          # works fine afterwards. Without the tolerance the whole
          # step (and the run) dies here — the v0.2.0-phase2 failure.
          gomobile init || true
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          gomobile bind -target android/arm64 -androidapi 26 \
            -o "$GITHUB_WORKSPACE/app/libs/libbox.aar" \
            -trimpath -ldflags "-s -w" \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api" \
            ./experimental/libbox
          ls -la "$GITHUB_WORKSPACE/app/libs"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocketlite-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "RocketLite ${{ github.ref_name }}" \
            --notes "Phase 2 build: sing-box core (libbox, arm64) integrated. Debug-signed APK for real-device testing. Requires an arm64 Android phone; allow installing unknown apps to sideload."
